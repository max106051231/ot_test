<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semi-Shield ISMS AI Agent 智能專家系統</title>
    <script src="/static/vendor/chart.umd.min.js"></script>
    <script src="/static/vendor/mermaid.min.js"></script>
    <style>
        :root {
            --bg-color: #07111f;
            --chat-bg: #0c1829;
            --panel-bg: #0a1524;
            --header-bg: rgba(8, 18, 32, 0.92);
            --text-main: #e8eef7;
            --text-muted: #8aa0b8;
            --border-color: rgba(100, 140, 180, 0.18);
            --border-strong: rgba(56, 189, 248, 0.35);
            --tech-blue: #4ec8f0;
            --tech-teal: #2dd4bf;
            --agent-glow: #0ea5e9;
            --user-bubble: #0b6ea8;
            --agent-bubble: rgba(18, 32, 52, 0.92);
            --sidebar-bg: #060e18;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 18px;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        body {
            font-family: "Noto Sans TC", "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
            background:
                radial-gradient(1200px 600px at 12% -10%, rgba(14, 165, 233, 0.16), transparent 55%),
                radial-gradient(900px 500px at 90% 110%, rgba(45, 212, 191, 0.08), transparent 50%),
                linear-gradient(165deg, #050b14 0%, var(--bg-color) 45%, #0a1628 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }
        body * { box-sizing: border-box; }

        /* 整合平台 iframe 嵌入模式：佔滿整個面板 */
        html.embedded, html.embedded body {
            height: 100%;
            width: 100%;
        }
        html.embedded body {
            display: block;
            padding: 0;
            background: var(--chat-bg);
            overflow: hidden;
        }
        html.embedded .chat-container {
            max-width: none;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 0;
            box-shadow: none;
            min-width: 0;
        }

        .chat-container {
            width: 100%;
            max-width: 920px;
            height: 85vh;
            background:
                linear-gradient(180deg, rgba(16, 36, 58, 0.55) 0%, transparent 120px),
                var(--chat-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.03) inset,
                0 24px 48px -18px rgba(0, 0, 0, 0.55);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 20px;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            /* 功能選單需蓋過下方訊息氣泡，否則會穿模／點不到 */
            position: relative;
            z-index: 200;
            overflow: visible;
        }

        .agent-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .agent-avatar {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(145deg, var(--tech-blue), #0369a1 60%, var(--tech-teal));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 0.02em;
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.28);
            flex-shrink: 0;
        }

        .agent-status-info h2 {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.01em;
            color: #f0f7ff;
        }

        .agent-status-info p {
            margin: 4px 0 0 0;
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            line-height: 1.4;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #34d399;
            display: inline-block;
            box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55);
            animation: pulse-dot 2.2s var(--ease) infinite;
        }
        @keyframes pulse-dot {
            0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5); }
            70% { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        .clear-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 7px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
        }
        .clear-btn:hover {
            color: #fda4af;
            border-color: rgba(244, 63, 94, 0.45);
            background: rgba(244, 63, 94, 0.08);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            flex-shrink: 0;
        }

        .feature-btn {
            background: rgba(56, 189, 248, 0.06);
            border: 1px solid var(--border-color);
            color: var(--tech-blue);
            padding: 7px 13px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: border-color 0.2s, background 0.2s, transform 0.15s var(--ease);
        }
        .feature-btn:hover {
            border-color: var(--border-strong);
            background: rgba(56, 189, 248, 0.14);
        }
        .feature-btn:active { transform: translateY(1px); }
        .feature-btn:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        .feature-menu {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: min(380px, 92vw);
            max-height: min(70vh, 520px);
            overflow: auto;
            background: rgba(8, 18, 32, 0.98);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.65);
            z-index: 300;
            padding: 14px;
            animation: msg-in 0.2s var(--ease) both;
            /* 自成層疊，避免被訊息氣泡蓋住 */
            isolation: isolate;
        }
        .feature-menu.open { display: block; }
        .feature-menu-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 190;
            background: rgba(2, 8, 18, 0.45);
        }
        .feature-menu-backdrop.open { display: block; }
        .chat-messages.menu-dimmed {
            pointer-events: none;
        }
        .feature-menu h3 {
            margin: 0 0 6px 0;
            font-size: 13px;
            color: #e8eef7;
            font-weight: 700;
        }
        .feature-menu .menu-hint {
            margin: 0 0 10px 0;
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.45;
        }
        .model-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 240px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(100, 140, 180, 0.45) transparent;
        }
        .model-list::-webkit-scrollbar { width: 8px; }
        .model-list::-webkit-scrollbar-thumb {
            background: rgba(100, 140, 180, 0.4);
            border-radius: 999px;
        }
        .model-list::-webkit-scrollbar-track { background: transparent; }
        .model-option {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            background: #111827;
        }
        .model-option:hover { border-color: #475569; }
        .model-option.active {
            border-color: var(--tech-blue);
            background: rgba(56, 189, 248, 0.1);
        }
        .model-option.unavailable {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .model-option input { margin-top: 2px; accent-color: var(--tech-blue); }
        .model-option .meta { min-width: 0; }
        .model-option .name {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 6px;
            font-size: 13px;
            color: #f1f5f9;
            font-weight: 600;
        }
        .model-option .slug {
            font-size: 11px;
            color: var(--text-muted);
            word-break: break-all;
            margin-top: 2px;
        }
        .model-group-title {
            margin: 10px 0 4px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #7dd3fc;
        }
        .model-group-title:first-child { margin-top: 0; }
        .model-badge {
            display: inline-block;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 999px;
            margin-left: 0;
            vertical-align: middle;
            font-weight: 600;
            white-space: nowrap;
        }
        .model-badge.finetuned {
            background: rgba(52, 211, 153, 0.18);
            color: #6ee7b7;
        }
        .model-badge.alias {
            background: rgba(56, 189, 248, 0.16);
            color: #7dd3fc;
        }
        .model-badge.base {
            background: rgba(251, 191, 36, 0.16);
            color: #fcd34d;
        }
        .model-status-hint {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
        }
        .model-menu-status {
            margin: 0 0 10px 0;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            min-height: 18px;
            line-height: 1.45;
            border-radius: 8px;
            background: rgba(7, 17, 31, 0.75);
            border: 1px solid var(--border-color);
        }
        .model-menu-status.busy {
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.35);
            background: rgba(251, 191, 36, 0.08);
        }
        .model-menu-status.ok {
            color: #34d399;
            border-color: rgba(52, 211, 153, 0.35);
            background: rgba(52, 211, 153, 0.08);
        }
        .model-menu-status.err {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.35);
            background: rgba(248, 113, 113, 0.08);
        }

        .chat-messages {
            flex: 1;
            padding: 22px 28px 28px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
            position: relative;
            z-index: 1;
            min-width: 0;
            background:
                radial-gradient(ellipse 70% 40% at 50% 0%, rgba(56, 189, 248, 0.04), transparent 70%);
        }
        .chat-messages::-webkit-scrollbar { width: 8px; }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(100, 140, 180, 0.28);
            border-radius: 999px;
        }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }

        .message {
            display: flex;
            gap: 10px;
            max-width: min(640px, 72%);
            animation: msg-in 0.35s var(--ease) both;
        }
        @keyframes msg-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: none; }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.agent {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-content-col {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
            flex: 1;
        }

        .reply-model-bar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .reply-model-bar:empty { display: none; }

        .bubble-head {
            display: none;
        }
        .reply-model-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 8px;
            letter-spacing: 0.02em;
            border: 1px solid rgba(56, 189, 248, 0.35);
            background: rgba(8, 22, 40, 0.92);
            color: #e0f2fe;
            max-width: 100%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .message.has-visual {
            max-width: min(820px, 92%);
        }

        .msg-avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .user .msg-avatar {
            background: rgba(14, 116, 144, 0.35);
            color: #7dd3fc;
            border: 1px solid rgba(56, 189, 248, 0.25);
        }
        .agent .msg-avatar {
            background: linear-gradient(145deg, var(--tech-blue), #0284c7);
            color: #fff;
        }

        .bubble {
            padding: 13px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            line-height: 1.68;
            letter-spacing: 0.01em;
            white-space: pre-wrap;
            min-width: 0;
        }

        .user .bubble {
            background: linear-gradient(160deg, #0e7490 0%, var(--user-bubble) 55%, #075985 100%);
            color: #f8fcff;
            border-radius: 16px 16px 4px 16px;
            box-shadow: 0 8px 18px rgba(2, 88, 140, 0.22);
        }

        .agent .bubble {
            background: var(--agent-bubble);
            color: var(--text-main);
            border-radius: 16px 16px 16px 4px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
        }

        .bubble-text { white-space: pre-wrap; }

        .agent .bubble {
            white-space: normal;
        }
        .agent .bubble p {
            margin: 0 0 0.7em;
        }
        .agent .bubble p:last-child { margin-bottom: 0; }
        .agent .bubble strong { color: #f1f8ff; font-weight: 700; }

        .reply-model-tag .tag-stage {
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 999px;
            font-weight: 700;
        }
        .reply-model-tag .tag-stage.finetuned {
            background: rgba(52, 211, 153, 0.18);
            color: #6ee7b7;
        }
        .reply-model-tag .tag-stage.base {
            background: rgba(251, 191, 36, 0.16);
            color: #fcd34d;
        }
        .reply-model-tag .tag-stage.system {
            background: rgba(148, 163, 184, 0.16);
            color: #cbd5e1;
        }
        .reply-model-tag .tag-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .reply-model-tag.guardrail {
            border-color: rgba(251, 191, 36, 0.35);
            color: #fde68a;
        }

        .rich-report {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .report-section-title {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            color: #e2e8f0;
            letter-spacing: 0.02em;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        .status-card {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            border-top: 3px solid #64748b;
        }
        .status-card.pass { border-top-color: #10b981; }
        .status-card.review { border-top-color: #f59e0b; }
        .status-card.fail { border-top-color: #ef4444; }

        .status-card .key {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
            word-break: break-all;
        }
        .status-card .value {
            font-size: 14px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 8px;
        }
        .status-card .desc {
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.45;
        }
        .status-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .status-badge.pass { background: rgba(16,185,129,.15); color: #34d399; }
        .status-badge.review { background: rgba(245,158,11,.15); color: #fbbf24; }
        .status-badge.fail { background: rgba(239,68,68,.15); color: #f87171; }

        .action-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .action-card {
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
        }
        .action-card h4 {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: var(--tech-blue);
        }
        .action-card .action-body {
            font-size: 13px;
            color: #e2e8f0;
            line-height: 1.55;
        }
        .action-card ul {
            margin: 6px 0 0 18px;
            padding: 0;
            color: #cbd5e1;
        }
        .action-card li { margin: 4px 0; }

        .md-block {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .md-block .report-hero {
            margin: 0;
            padding: 12px 14px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(56,189,248,.16), rgba(14,165,233,.08));
            border: 1px solid rgba(56,189,248,.3);
            color: #7dd3fc;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.02em;
        }
        .md-section-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
        }
        .md-section-card.tone-0 { border-top: 3px solid #38bdf8; }
        .md-section-card.tone-1 { border-top: 3px solid #34d399; }
        .md-section-card.tone-2 { border-top: 3px solid #f59e0b; }
        .md-section-card.tone-3 { border-top: 3px solid #a78bfa; }
        .md-section-card.tone-4 { border-top: 3px solid #f472b6; }
        .md-card-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid #1e293b;
        }
        .md-card-index {
            flex: 0 0 auto;
            min-width: 28px;
            height: 28px;
            padding: 0 8px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: #0f172a;
            background: #38bdf8;
        }
        .md-section-card.tone-1 .md-card-index { background: #34d399; }
        .md-section-card.tone-2 .md-card-index { background: #fbbf24; }
        .md-section-card.tone-3 .md-card-index { background: #c4b5fd; }
        .md-section-card.tone-4 .md-card-index { background: #f9a8d4; }
        .md-card-title {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            color: #f1f5f9;
            line-height: 1.35;
        }
        .md-card-body {
            padding: 12px 14px 14px;
        }
        .md-card-body .md-card-content {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 12px 14px;
        }
        .md-card-body h3, .md-card-body h4 {
            margin: 8px 0 6px;
            color: #e2e8f0;
        }
        .md-card-body h3 { font-size: 14px; }
        .md-card-body h4 { font-size: 13px; color: var(--tech-blue); }
        .md-card-body p {
            margin: 0 0 8px;
            color: #e2e8f0;
            line-height: 1.65;
            white-space: pre-wrap;
        }
        .md-card-body p:last-child { margin-bottom: 0; }
        .md-card-body ul, .md-card-body ol {
            margin: 8px 0 0 0;
            padding-left: 18px;
            color: #cbd5e1;
        }
        .md-card-body li {
            margin: 4px 0;
            line-height: 1.55;
            padding: 0;
            background: transparent;
            border-radius: 0;
            list-style-position: outside;
        }
        .md-card-body li::marker { color: #38bdf8; }
        .md-card-body strong { color: #f8fafc; }
        .md-card-body pre.md-code {
            margin: 8px 0 4px;
            padding: 10px 12px;
            background: #0b1220;
            border: 1px solid #1e293b;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.45;
            color: #94a3b8;
            max-height: 220px;
        }
        .md-card-body pre.md-code code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .md-block .end-mark {
            margin-top: 0;
            font-size: 12px;
            color: #64748b;
            text-align: right;
            padding: 0 4px;
        }

        .viz-block {
            margin-top: 12px;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .viz-title {
            font-size: 13px;
            color: var(--tech-blue);
            margin: 0 0 10px 0;
            font-weight: 600;
        }

        .chart-wrap {
            position: relative;
            width: 100%;
            height: 260px;
        }

        .mermaid-wrap {
            overflow-x: auto;
            background: #111827;
            border-radius: 6px;
            padding: 12px;
        }

        .mermaid-wrap svg {
            max-width: 100%;
            height: auto;
        }

        /* 防止 Mermaid 語法錯誤時炸彈圖示殘留在對話區 */
        #chatBox > svg,
        #chatBox > div[id^="dmermaid"],
        #chatBox svg[aria-roledescription="error"],
        #chatBox .viz-block:has(.error-icon),
        #chatBox .mermaid-wrap:has(.error-icon) {
            display: none !important;
        }

        .tool-call {
            background-color: #0f172a;
            border-left: 3px solid var(--tech-blue);
            padding: 8px 12px;
            font-family: monospace;
            font-size: 12px;
            color: #38bdf8;
            border-radius: 4px;
            margin: 5px 0;
            width: fit-content;
        }

        .rag-cite {
            background: rgba(6, 24, 20, 0.85);
            border: 1px solid rgba(16, 185, 129, 0.28);
            border-left: 3px solid #34d399;
            padding: 10px 14px;
            font-size: 12px;
            color: #6ee7b7;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            margin: 2px 0 2px 44px;
            width: fit-content;
            max-width: min(640px, 72%);
            animation: msg-in 0.35s var(--ease) both;
        }
        .rag-cite summary {
            cursor: pointer;
            color: #6ee7b7;
            font-weight: 650;
            letter-spacing: 0.01em;
        }
        .rag-cite ol {
            margin: 8px 0 0 18px;
            padding: 0;
            color: #94a3b8;
            line-height: 1.55;
        }

        .guard-banner {
            background: rgba(69, 10, 10, 0.75);
            border-left: 3px solid #f43f5e;
            padding: 8px 12px;
            font-size: 12px;
            color: #fda4af;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            margin: 5px 0;
            width: fit-content;
        }

        .chat-input-area {
            padding: 14px 18px 16px;
            background: linear-gradient(180deg, rgba(8, 18, 32, 0.4), var(--header-bg));
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .chat-input {
            flex: 1;
            background: rgba(7, 17, 31, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 13px 16px;
            color: var(--text-main);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .chat-input::placeholder { color: #64748b; }
        .chat-input:focus {
            border-color: var(--border-strong);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);

        .send-btn {
            background: linear-gradient(145deg, #22d3ee, #0284c7 55%, #0369a1);
            color: #fff;
            border: none;
            padding: 0 22px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: filter 0.2s, transform 0.15s var(--ease), box-shadow 0.2s;
            box-shadow: 0 8px 18px rgba(14, 165, 233, 0.28);
            min-width: 72px;
        }

        .send-btn:hover {
            filter: brightness(1.08);
            box-shadow: 0 10px 22px rgba(14, 165, 233, 0.38);
        }
        .send-btn:active { transform: translateY(1px); }
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: none;
            box-shadow: none;
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 6px 4px;
            align-items: center;
        }
        .typing-dot {
            width: 6px;
            height: 6px;
            background-color: var(--tech-blue);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;

        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.35); opacity: 0.35; }
            40% { transform: scale(1.0); opacity: 1; }
        }

        /* ===== 對話紀錄右側欄 ===== */
        .app-shell {
            display: flex;
            width: 100%;
            max-width: 1280px;
            height: 85vh;
            gap: 0;
            align-items: stretch;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.04),

        }
        html.embedded .app-shell {
            max-width: none;
            width: 100%;
            height: 100%;
            border-radius: 0;
            box-shadow: none;
            min-width: 0;
        }
        .app-shell .chat-container {
            flex: 1 1 auto;
            width: auto;
            max-width: none;
            height: 100%;
            border-radius: 0;
            border: none;
            box-shadow: none;
        }
        html.embedded .app-shell .chat-container {
            border-radius: 0;
        }
        .history-sidebar {
            width: 268px;
            flex: 0 0 268px;
            background:
                linear-gradient(180deg, rgba(14, 165, 233, 0.05) 0%, transparent 80px),
                var(--sidebar-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;

        html.embedded .history-sidebar {
            border-radius: 0;

        .history-header {
            padding: 16px 14px;
            border-bottom: 1px solid var(--border-color);
            display: flex;

            background: rgba(8, 18, 32, 0.75);
        }
        .history-header h3 {
            margin: 0;
            font-size: 12px;
            color: #c5d4e6;
            font-weight: 700;
            letter-spacing: 0.08em;

        .history-new-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: var(--tech-blue);
            padding: 5px 11px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            transition: background 0.2s, border-color 0.2s;
        }
        .history-new-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: var(--tech-blue);
        }
        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-thumb {
            background: rgba(100, 140, 180, 0.25);
            border-radius: 999px;
        }
        .history-item {
            border: 1px solid transparent;
            border-radius: 12px;
            background: rgba(15, 28, 44, 0.65);
            padding: 10px 11px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: border-color 0.2s, background 0.2s, transform 0.15s var(--ease);
        }
        .history-item:hover {
            border-color: rgba(100, 140, 180, 0.35);

            border-color: var(--border-strong);

        .history-item-title {
            font-size: 12.5px;
            color: #e8eef7;
            font-weight: 600;
            line-height: 1.4;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;

        .history-item-meta {
            font-size: 10px;

        .history-item-actions {
            display: flex;

        .history-item-actions button {
            flex: 1;
            background: rgba(7, 17, 31, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 6px;
            padding: 4px 0;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }
        .history-item-actions button:hover {
            color: var(--tech-blue);
            border-color: rgba(56, 189, 248, 0.45);
        }
        .history-item-actions button.danger:hover {
            color: #ef4444;
            border-color: #ef4444;
        }
        .history-empty {
            padding: 28px 12px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;

        .history-toggle-btn {
            display: none;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 7px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        @media (max-width: 900px) {
            .app-shell { max-width: 100%; height: 100vh; border-radius: 0; }
            .history-sidebar {
                position: fixed;
                right: 0;
                top: 0;
                bottom: 0;
                z-index: 50;
                border-left: 1px solid var(--border-color);
                border-radius: 0;
                transform: translateX(100%);
                transition: transform 0.25s var(--ease);
                box-shadow: -12px 0 40px rgba(0, 0, 0, 0.45);
            }
            .history-sidebar.open { transform: translateX(0); }
            .history-toggle-btn { display: inline-block; }
            .app-shell .chat-container { border-radius: 0; }
            .chat-messages { padding: 16px 14px 20px; }
            .message { max-width: 88%; }
        }
    </style>
</head>
<body>

    <div class="feature-menu-backdrop" id="featureMenuBackdrop" onclick="closeFeatureMenu()"></div>
    <div class="app-shell">
        <div class="chat-container">
            <div class="chat-header">
                <div class="agent-profile">
                    <div class="agent-avatar">AI</div>
                    <div class="agent-status-info">
                        <h2>Semi-Shield Cyber Agent</h2>
                        <p><span class="status-dot"></span> <span id="safetyStatusText">實時連線：OT + RAG + 護欄 · 支援多種圖形</span></p>
                    </div>
                </div>
                <div class="header-actions">
                    <button type="button" class="history-toggle-btn" id="historyToggleBtn" onclick="toggleHistorySidebar(event)">紀錄</button>
                    <button type="button" class="feature-btn" id="featureMenuBtn" onclick="toggleFeatureMenu(event)">功能選單 ▾</button>
                    <button class="clear-btn" onclick="clearChat()">重設對話</button>
                    <div class="feature-menu" id="featureMenu" role="menu" aria-label="功能選單" onclick="event.stopPropagation()">
                        <h3>回覆模型</h3>
                        <p class="menu-hint" id="modelMenuHint">Ollama 後端：建議 qwen2.5:3b 或 qwen3_4b_ot。Gemma 2B OT 若對話異常請執行 rebuild_gemma_ot.bat。</p>
                        <div class="model-menu-status" id="modelMenuStatus">尚未載入清單</div>
                        <div class="model-list" id="modelList">
                            <div class="menu-hint">載入模型清單中…</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="chat-messages" id="chatBox"></div>

            <div class="chat-input-area">
                <input type="text" class="chat-input" id="userInput" placeholder="例如：畫出各種圖形（長條、圓餅、折線、雷達）..." onkeydown="if(event.key === 'Enter') sendMessage()">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">發送</button>
            </div>
        </div>

        <aside class="history-sidebar" id="historySidebar" aria-label="對話紀錄">
            <div class="history-header">
                <h3>對話紀錄</h3>
                <button type="button" class="history-new-btn" onclick="createNewChat()">＋ 新增</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty">尚無對話紀錄</div>
            </div>
        </aside>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chartInstances = [];
        const LLM_MODEL_KEY = 'ot_agent_llm_model';
        let selectedLlmModel = localStorage.getItem(LLM_MODEL_KEY) || '';
        let llmModelsCache = [];
        let llmCachedSlugs = [];
        let modelSwitching = false;


        // ===== 對話紀錄（右側欄，localStorage）=====
        const CHAT_HISTORY_KEY = 'ot_agent_chat_sessions_v1';
        const WELCOME_TEXT = '您好！我是您的 ISO 27001 專家 Agent。可請我「畫出各種圖形」、「圓餅圖看事件占比」、「折線圖比較控制項」或「用流程圖說明修補步驟」；支援長條/圓餅/折線/雷達/環圈/極區圖與 Mermaid 流程圖。';
        let chatSessions = [];
        let activeChatId = '';
        let historyHydrating = false;

        function uid() {
            return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
        }

        function loadChatStore() {
            try {
                const raw = localStorage.getItem(CHAT_HISTORY_KEY);
                if (!raw) return { sessions: [], activeId: '' };
                const data = JSON.parse(raw);
                return {
                    sessions: Array.isArray(data.sessions) ? data.sessions : [],
                    activeId: data.activeId || ''
                };
            } catch (_) {
                return { sessions: [], activeId: '' };
            }
        }

        function saveChatStore() {
            try {
                localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify({
                    sessions: chatSessions,
                    activeId: activeChatId
                }));
            } catch (e) {
                console.warn('對話紀錄儲存失敗', e);
            }
        }

        function getActiveSession() {
            return chatSessions.find((s) => s.id === activeChatId) || null;
        }

        function makeEmptySession(title) {
            const now = Date.now();
            return {
                id: uid(),
                title: title || '新對話',
                titleLocked: false, // 手動改名後鎖定，不再被第一則提問覆蓋
                createdAt: now,
                updatedAt: now,
                messages: [{ role: 'agent', text: WELCOME_TEXT, ts: now }]
            };
        }

        function formatChatTime(ts) {
            try {
                const d = new Date(ts || Date.now());
                const pad = (n) => String(n).padStart(2, '0');
                return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            } catch (_) {
                return '';
            }
        }

        function deriveTitleFromText(text) {
            const t = String(text || '').replace(/\s+/g, ' ').trim();
            if (!t) return '新對話';
            return t.length > 28 ? t.slice(0, 28) + '…' : t;
        }

        function renderHistoryList() {
            const list = document.getElementById('historyList');
            if (!list) return;
            if (!chatSessions.length) {
                list.innerHTML = '<div class="history-empty">尚無對話紀錄<br>點「＋ 新增」開始</div>';
                return;
            }
            const sorted = [...chatSessions].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
            list.innerHTML = sorted.map((s) => {
                const active = s.id === activeChatId ? ' active' : '';
                const count = (s.messages || []).filter((m) => m.role === 'user').length;
                const title = escapeHtml(s.title || '未命名對話');
                const meta = escapeHtml(`${formatChatTime(s.updatedAt)} · ${count} 則提問`);
                const idJs = JSON.stringify(s.id);
                return `
                    <div class="history-item${active}" onclick='switchChatSession(${idJs})'>
                        <div class="history-item-title">${title}</div>
                        <div class="history-item-meta">${meta}</div>
                        <div class="history-item-actions" onclick="event.stopPropagation()">
                            <button type="button" onclick='renameChatSession(${idJs})'>編輯</button>
                            <button type="button" class="danger" onclick='deleteChatSession(${idJs})'>刪除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function destroyCharts() {
            while (chartInstances.length) {
                const c = chartInstances.pop();
                try { c.destroy(); } catch (_) {}
            }
        }

        async function renderSessionMessages(session) {
            historyHydrating = true;
            destroyCharts();
            chatBox.innerHTML = '';
            const msgs = (session && session.messages) || [];
            for (const m of msgs) {
                if (m.role === 'user') {
                    appendBubble('user', 'U', m.text || '', true);
                } else {
                    await appendAgentReply(m.text || '', {
                        skipPersist: true,
                        llmModel: m.llmModel || getSelectedLlmInfo(),
                    });
                }
            }
            if (!msgs.length) {
                appendBubble('agent', '🤖', WELCOME_TEXT, true);
            }
            historyHydrating = false;
            chatBox.scrollTop = chatBox.scrollHeight;
            purgeMermaidErrorArtifacts();
        }

        function pushMessageToActive(role, text, meta) {
            if (historyHydrating) return;
            const s = getActiveSession();
            if (!s) return;
            const clean = String(text || '');
            if (!clean) return;
            s.messages = s.messages || [];
            const msg = { role, text: clean, ts: Date.now() };
            if (role === 'agent' && meta && meta.llmModel) {
                msg.llmModel = normalizeLlmModelInfo(meta.llmModel);
            }
            s.messages.push(msg);
            s.updatedAt = Date.now();
            if (role === 'user' && !s.titleLocked) {
                const userCount = s.messages.filter((m) => m.role === 'user').length;
                // 僅首則提問自動取名；手動「編輯」後 titleLocked=true，之後不再改
                if (userCount === 1) {
                    s.title = deriveTitleFromText(clean);
                }
            }
            saveChatStore();
            renderHistoryList();
        }

        async function createNewChat() {
            const s = makeEmptySession('新對話');
            chatSessions.unshift(s);
            activeChatId = s.id;
            saveChatStore();
            renderHistoryList();
            await renderSessionMessages(s);
            userInput.focus();
        }

        async function switchChatSession(id) {
            if (!id || id === activeChatId) return;
            const s = chatSessions.find((x) => x.id === id);
            if (!s) return;
            activeChatId = id;
            saveChatStore();
            renderHistoryList();
            await renderSessionMessages(s);
            const side = document.getElementById('historySidebar');
            if (side && window.matchMedia('(max-width: 900px)').matches) {
                side.classList.remove('open');
            }
        }

        function renameChatSession(id) {
            const s = chatSessions.find((x) => x.id === id);
            if (!s) return;
            const next = prompt('編輯對話名稱', s.title || '未命名對話');
            if (next == null) return;
            const title = String(next).trim();
            if (!title) return;
            s.title = title.slice(0, 60);
            s.titleLocked = true; // 手動命名後固定，不再被第一則輸入覆蓋
            s.updatedAt = Date.now();
            saveChatStore();
            renderHistoryList();
        }

        async function deleteChatSession(id) {
            const s = chatSessions.find((x) => x.id === id);
            if (!s) return;
            if (!confirm(`確定刪除「${s.title || '未命名對話'}」？此操作無法復原。`)) return;
            chatSessions = chatSessions.filter((x) => x.id !== id);
            if (activeChatId === id) {
                if (chatSessions.length) {
                    activeChatId = chatSessions[0].id;
                    saveChatStore();
                    renderHistoryList();
                    await renderSessionMessages(chatSessions[0]);
                } else {
                    await createNewChat();
                    return;
                }
            } else {
                saveChatStore();
                renderHistoryList();
            }
        }

        function toggleHistorySidebar(ev) {
            if (ev) ev.stopPropagation();
            const side = document.getElementById('historySidebar');
            if (!side) return;
            side.classList.toggle('open');
        }

        async function initChatHistory() {
            const store = loadChatStore();
            chatSessions = store.sessions || [];
            activeChatId = store.activeId || '';
            // 舊資料：標題若已不是預設、且與第一則提問不同 → 視為手動命名並鎖定
            chatSessions.forEach((s) => {
                if (!s || s.titleLocked) return;
                const t = String(s.title || '').trim();
                if (!t || t === '新對話' || t === '未命名對話') return;
                const firstUser = (s.messages || []).find((m) => m.role === 'user');
                const auto = firstUser ? deriveTitleFromText(firstUser.text) : '';
                if (t !== auto) s.titleLocked = true;
            });
            if (!chatSessions.length) {
                await createNewChat();
                return;
            }
            if (!activeChatId || !chatSessions.some((s) => s.id === activeChatId)) {
                activeChatId = chatSessions[0].id;
            }
            saveChatStore();
            renderHistoryList();
            await renderSessionMessages(getActiveSession());
        }


        function setModelMenuStatus(text, kind) {
            const el = document.getElementById('modelMenuStatus');
            if (!el) return;
            el.textContent = text || '';
            el.className = 'model-menu-status' + (kind ? ' ' + kind : '');
            // 強制重繪，避免切換過程中畫面卡在舊提示
            void el.offsetWidth;
        }

        function setFeatureMenuOpen(open) {
            const menu = document.getElementById('featureMenu');
            const backdrop = document.getElementById('featureMenuBackdrop');
            const box = document.getElementById('chatBox');
            if (menu) menu.classList.toggle('open', !!open);
            if (backdrop) backdrop.classList.toggle('open', !!open);
            if (box) box.classList.toggle('menu-dimmed', !!open);
        }

        function closeFeatureMenu() {
            if (modelSwitching) return; // 切換中勿關，以免看不到進度
            setFeatureMenuOpen(false);
        }

        function toggleFeatureMenu(ev) {
            if (ev) ev.stopPropagation();
            const menu = document.getElementById('featureMenu');
            if (!menu) return;
            const open = !menu.classList.contains('open');
            setFeatureMenuOpen(open);
            if (open) loadModelMenu();
        }

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('featureMenu');
            const btn = document.getElementById('featureMenuBtn');
            if (menu && menu.classList.contains('open')) {
                if (!(menu.contains(e.target) || (btn && btn.contains(e.target)))) {
                    closeFeatureMenu();
                }
            }
            const side = document.getElementById('historySidebar');
            const hbtn = document.getElementById('historyToggleBtn');
            if (side && side.classList.contains('open') && window.matchMedia('(max-width: 900px)').matches) {
                if (!(side.contains(e.target) || (hbtn && hbtn.contains(e.target)))) {
                    side.classList.remove('open');
                }
            }
        });

        function isModelOptionActive(m, current) {
            const curSlug = (current && current.slug) || selectedLlmModel || '';
            const curPath = (current && current.path) || '';
            const curLoad = (current && current.load_path) || '';
            const curStage = (current && current.stage) || '';
            const mStage = m.stage === 'base' ? 'base' : 'finetuned';
            const curStageNorm = curStage === 'base' ? 'base' : 'finetuned';
            // 微調前／微調後不可互標「使用中」（避免 base_model_id 誤判）
            if (curStage && mStage && curStageNorm !== mStage && m.stage !== 'alias') return false;
            if (m.active === true) return true;
            if (m.active === false && curStage) return false;
            if (m.slug && m.slug === curSlug) return true;
            if (curPath && (m.path === curPath || m.load_path === curPath)) return true;
            if (curLoad && (m.path === curLoad || m.load_path === curLoad)) return true;
            if (selectedLlmModel && m.slug === selectedLlmModel) {
                if (curStage && mStage && curStageNorm !== mStage && m.stage !== 'alias') return false;
                return true;
            }
            if (selectedLlmModel && (m.path === selectedLlmModel || m.load_path === selectedLlmModel)) {
                if (curStage && mStage && curStageNorm !== mStage && m.stage !== 'alias') return false;
                return true;
            }
            return false;
        }

        function renderModelOption(m, current) {
            const active = isModelOptionActive(m, current);
            const unavailable = m.available === false;
            const checked = active && !unavailable ? 'checked' : '';
            const activeCls = active ? ' active' : '';
            const disCls = unavailable ? ' unavailable' : '';
            const slugJs = JSON.stringify(String(m.slug || m.path || ''));
            const stage = m.stage === 'base' ? 'base' : (m.stage === 'alias' ? 'alias' : 'finetuned');
            const stageText = m.stage_label || (stage === 'base' ? '微調前' : (stage === 'alias' ? 'Semi-Shield 別名' : '微調後'));
            const sub = unavailable
                ? (m.unavailable_reason || '本機無快取，無法載入')
                : (m.desc || m.slug || m.path);
            const statusBits = [
                active ? '使用中' : '',
                unavailable ? '不可用' : '',
            ].filter(Boolean).join(' · ');
            return `
                <label class="model-option${activeCls}${disCls}" title="${escapeHtml(sub)}">
                    <input type="radio" name="llmModel" value="${escapeHtml(m.slug || m.path)}" ${checked}
                        ${unavailable ? 'disabled' : ''}
                        onchange='selectLlmModel(${slugJs})'>
                    <span class="meta">
                        <div class="name">
                            <span class="model-title">${escapeHtml(m.label || m.slug)}</span>
                            <span class="model-badge ${stage}">${escapeHtml(stageText)}</span>
                            ${statusBits ? `<span class="model-status-hint">${escapeHtml(statusBits)}</span>` : ''}
                        </div>
                        <div class="slug">${escapeHtml(sub)}</div>
                    </span>
                </label>
            `;
        }

        function renderModelList(models, current, groups) {
            const list = document.getElementById('modelList');
            if (!list) return;
            const finetuned = (groups && groups.finetuned) || models.filter((m) => m.stage !== 'base');
            const base = (groups && groups.base) || models.filter((m) => m.stage === 'base');
            if (!finetuned.length && !base.length) {
                list.innerHTML = '<div class="menu-hint">尚未掃描到可載入模型。請執行 import_ollama_models.bat</div>';
                return;
            }
            let html = '';
            if (finetuned.length) {
                html += '<div class="model-group-title">微調後（Semi-Shield / 本地 OT）</div>';
                html += finetuned.map((m) => renderModelOption(m, current)).join('');
            }
            if (base.length) {
                html += '<div class="model-group-title">微調前（Ollama 官方基底）</div>';
                html += base.map((m) => renderModelOption(m, current)).join('');
            }
            list.innerHTML = html;

        async function loadModelMenu(opts) {
            const keepStatus = !!(opts && opts.keepStatus);
            if (!keepStatus) setModelMenuStatus('讀取模型清單…', 'busy');
            try {
                const res = await fetch('/api/llm/models', { cache: 'no-store' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '無法取得模型清單');
                llmModelsCache = data.models || [];
                llmCachedSlugs = (data.cached_models || []).map((c) => c.slug).filter(Boolean);
                const current = data.current || {};
                if (current.slug) {
                    selectedLlmModel = current.slug;
                    localStorage.setItem(LLM_MODEL_KEY, selectedLlmModel);
                } else if (current.path) {
                    selectedLlmModel = current.path;
                    localStorage.setItem(LLM_MODEL_KEY, selectedLlmModel);
                }
                renderModelList(llmModelsCache, current, data.groups || null);
                if (!keepStatus) {
                    const cacheHint = llmCachedSlugs.length
                        ? ` · 快取 ${llmCachedSlugs.length}/${data.cache_max || '?'}`
                        : '';

                    const stageHint = current.stage_label ? ` · ${current.stage_label}` : '';

                    if (hintEl && data.hint) hintEl.textContent = data.hint;

        async function selectLlmModel(slug) {
            if (!slug || modelSwitching) return;
            setFeatureMenuOpen(true);
            const meta = llmModelsCache.find((m) => m.slug === slug || m.path === slug);
            if (meta && meta.available === false) {
                setModelMenuStatus(meta.unavailable_reason || '此模型目前不可用', 'err');
                return;
            }
            if (slug === selectedLlmModel && llmModelsCache.some((m) => isModelOptionActive(m, { slug: selectedLlmModel, stage: m.stage }))) {
                setModelMenuStatus('已是目前模型「' + ((meta && meta.label) || slug) + '」', 'ok');
                return;
            }
            modelSwitching = true;
            const btn = document.getElementById('featureMenuBtn');
            if (btn) btn.disabled = true;
            setSending(true);
            const nice = (meta && meta.label) || slug;
            const started = Date.now();
            let tick = 0;
            const progressTimer = setInterval(() => {
                tick += 1;
                const sec = Math.round((Date.now() - started) / 1000);
                setModelMenuStatus(
                    `正在切換「${nice}」… ${sec}s（釋放舊模型／載入中${tick % 2 ? '…' : '···'}）`,
                    'busy'
                );
            }, 800);
            setModelMenuStatus(`正在切換「${nice}」…`, 'busy');
            try {
                const res = await fetch('/api/llm/switch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: slug })
                });
                let data = {};
                try { data = await res.json(); } catch (_) { data = {}; }
                if (!data.ok) {
                    throw new Error(data.error || ('切換失敗（HTTP ' + res.status + '）'));
                }
                selectedLlmModel = data.slug || slug;
                localStorage.setItem(LLM_MODEL_KEY, selectedLlmModel);
                const sec = Math.round((Date.now() - started) / 1000);
                const isOllama = data.backend === 'ollama' || data.device === 'ollama';
                setModelMenuStatus(
                    (data.message || ('已切換為 ' + (data.label || selectedLlmModel)))
                    + (data.device ? ` · ${data.device}` : '')
                    + (isOllama ? '' : `（${sec}s）`),
                    'ok'
                );
                await loadModelMenu({ keepStatus: true });
                updateHeaderModelHint(data);
            } catch (e) {
                setModelMenuStatus(e.message || '切換失敗', 'err');
                await loadModelMenu({ keepStatus: true });
            } finally {
                clearInterval(progressTimer);
                modelSwitching = false;
                if (btn) btn.disabled = false;
                setSending(false);
            }
        }

        function buildChatHistoryForApi(maxTurns = 6) {
            // 在寫入本則使用者訊息之前呼叫：只帶「先前」對話給後端做多輪理解
            const s = getActiveSession();
            if (!s || !Array.isArray(s.messages)) return [];
            const out = [];
            for (const m of s.messages) {
                if (!m || !m.text) continue;
                const t = String(m.text).trim();
                if (!t || t === WELCOME_TEXT) continue;
                if (m.role === 'user') {
                    out.push({ role: 'user', content: t.slice(0, 600) });
                } else if (m.role === 'agent') {
                    out.push({ role: 'assistant', content: t.slice(0, 700) });
                }
            }
            return out.slice(-(Math.max(1, maxTurns) * 2));
        }

        async function sendMessage() {
            const text = userInput.value.trim();

                appendBubble('agent', '🤖', '模型切換中，請稍候再傳送訊息。');

            const history = buildChatHistoryForApi(6);
            appendBubble('user', 'U', text);
            userInput.value = '';
            setSending(true);

            const typingId = showTypingIndicator();

            try {
                const payload = { message: text, history };
                if (selectedLlmModel) payload.model = selectedLlmModel;
                const response = await fetch('/api/agent/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                removeTypingIndicator(typingId);

                if (!response.ok) {
                    appendBubble('agent', '🤖', `❌ ${data.error || '伺服器回傳錯誤'}`, false, { llmModel: data.llm_model || getSelectedLlmInfo() });
                    return;

                if (data.status === 'blocked' || (data.guardrail && data.guardrail.blocked)) {

                        llmModel: data.llm_model || getSelectedLlmInfo(),

                // if (data.tool_called) {
                //     appendToolCallNotify(data.tool_name, data.tool_query);

                // 先顯示診斷報告，RAG 引用改放報告後方（可摺疊、不含 Log）

                        stage_label: cached.stage === 'finetuned' ? '微調後' : '微調前',

            }

            const slug = (info.slug || info.path || '').trim();
            const label = (info.label || slug || 'LLM').trim();
            const stage = info.stage || 'base';
            return {

                label,

        function sanitizeZhTwClient(text) {
            // 前端雙保險：去日文、去照抄的 RAG/Log 前綴、整理標題
            let t = String(text || '');
            t = t.replace(/\uFFFD/g, '');
            t = t.replace(/^(?:system|assistant|user)\s*[:：]?\s*\n+/i, '');
            t = t.replace(/<\|(?:system|assistant|user|end|im_start|im_end)\|>\s*/gi, '');
            t = t.replace(/^請(?:用|只用)?(?:繁體)?中文回答[^\n]*$/gmi, '');
            t = t.replace(/^.*使用\s*Markdown\s*格式[^\n]*$/gmi, '');
            t = t.replace(/答え終了\**/g, '');
            t = t.replace(/回答終了\**/g, '');
            // 前端折掉「具體XXX」循環條列（第二輪起刪）
            {
                const lines = t.split('\n');
                const seen = new Set();
                let loop = false;
                const kept = [];
                lines.forEach((ln) => {
                    const m = String(ln).trim().match(/^[-*•]?\s*(具體[\u4e00-\u9fffA-Za-z0-9]{1,12})\s*$/);
                    if (!m) { kept.push(ln); return; }
                    if (loop) return;
                    if (seen.has(m[1])) { loop = true; return; }
                    seen.add(m[1]);
                    kept.push('- ' + m[1]);
                });
                t = kept.join('\n');
            }

            // 若正文前貼了監控/RAG 原文，切到報告起點
            const startRe = /(?:^|\n)(##\s*地端\s*LLM|##\s*一、|##\s*事件經過)/i;
            const sm = startRe.exec(t);
            if (sm && sm.index > 20) {
                const head = t.slice(0, sm.index);
                if (/SNMP|WLC-|\/var\/log|寫入\s*\d+\s*檔|\[知識|核心網監測|RAG|監控資料|已略過大段英文/i.test(head)) {
                    t = t.slice(sm.index).replace(/^\n+/, '');
                }
            }
            t = t.replace(/^#{1,4}\s*AI\s*[:：]\s*/gim, '');

            t = t.split('\n').filter((line) => {
                if (/[\u3040-\u309F\u30A0-\u30FF]/.test(line)) return false;
                if (/イベント|経過概要|危険評価|修正提案|セキュリティ|単語以内/.test(line)) return false;
                if (/\[知識\d*|寫入\s*\d+\s*檔\s*SNMP|\[核心網監測\]|已略過大段英文原文/i.test(line)) return false;
                if (/^(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2}\s+\d{2}:/.test(line)) return false;
                return true;
            }).join('\n');
            t = t.replace(/([^\n])\s*(##\s+)/g, '$1\n\n$2');
            t = t.replace(/([。！？；])\s*[-•]\s+/g, '$1\n- ');
            t = t.replace(/\n{3,}/g, '\n\n').trim();
            if (t.length > 1260) {
                const fences = [];
                t = t.replace(/```(?:chart|mermaid)[\s\S]*?```/gi, (m) => {
                    fences.push(m);
                    return `\n%%FENCE${fences.length - 1}%%\n`;
                });
                t = t.slice(0, 1260);
                fences.forEach((f, i) => {
                    t = t.replace(`%%FENCE${i}%%`, f);
                });
            }
            return t;
        }

        async function appendAgentReply(rawText, opts) {
            const options = typeof opts === 'boolean' ? { skipPersist: opts } : (opts || {});
            const llmModel = options.llmModel || getSelectedLlmInfo();
            rawText = sanitizeZhTwClient(rawText);
            const parsed = parseVisualBlocks(rawText);
            const report = parseStructuredReport(parsed.text || rawText || '');
            const hasReport = report.items.length > 0 || report.actions.length > 0;
            const shell = buildAgentMessageShell(llmModel, options.variant);
            const msgDiv = shell.msgDiv;
            msgDiv.className = `message agent${(parsed.visuals.length || hasReport) ? ' has-visual' : ''}`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            shell.col.appendChild(bubble);
            chatBox.appendChild(msgDiv);

            // 結構化合規報告（卡片 + 圖表 + 改善方案）
            if (hasReport) {
                const reportEl = document.createElement('div');
                reportEl.className = 'rich-report';
                bubble.appendChild(reportEl);
                renderStructuredReport(reportEl, report);

                if (report.items.length) {
                    const chartBlock = document.createElement('div');
                    chartBlock.className = 'viz-block';
                    bubble.appendChild(chartBlock);
                    await renderChartBlock(chartBlock, buildStatusChartFromItems(report.items));
                }
            } else if ((parsed.text || '').trim()) {
                // 一般 Markdown 美化
                const md = document.createElement('div');
                md.className = 'md-block';
                md.innerHTML = renderMarkdownLite(parsed.text.trim());
                bubble.appendChild(md);
            }

            for (const visual of parsed.visuals) {
                const block = document.createElement('div');
                block.className = 'viz-block';
                bubble.appendChild(block);

                if (visual.kind === 'chart') {
                    let specs = [];
                    if (visual.payload) {
                        specs = [visual.payload];
                    } else if (visual.lazyMetrics) {
                        specs = await fetchMetricsChartSpecs(rawText);
                    }
                    if (specs.length) {
                        await renderChartBlock(block, specs[0]);
                        for (let i = 1; i < specs.length; i++) {
                            const extra = document.createElement('div');
