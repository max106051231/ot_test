<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semi-Shield ISMS · 歡迎</title>
    <style>
        :root {
            --bg: #030712;
            --text: #e8f4ff;
            --muted: #7a9ab8;
            --accent: #38bdf8;
            --accent-2: #2dd4bf;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: "Noto Sans TC", "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .welcome {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            cursor: pointer;
            user-select: none;
            overflow: hidden;
        }

        /* 網格底圖 */
        .grid-bg {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, #000 20%, transparent 75%);
            animation: grid-drift 24s linear infinite;
        }

        @keyframes grid-drift {
            from { transform: perspective(500px) rotateX(58deg) translateY(0); }
            to { transform: perspective(500px) rotateX(58deg) translateY(48px); }
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
            pointer-events: none;
        }

        .glow-orb.a {
            width: 420px;
            height: 420px;
            background: rgba(14, 165, 233, 0.35);
            top: 10%;
            left: 15%;
            animation: orb-float 8s ease-in-out infinite alternate;
        }

        .glow-orb.b {
            width: 320px;
            height: 320px;
            background: rgba(45, 212, 191, 0.22);
            bottom: 8%;
            right: 12%;
            animation: orb-float 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes orb-float {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(24px, -18px) scale(1.08); }
        }

        /* 掃描線 */
        .scanline {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.35;
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: -2%; opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { top: 102%; opacity: 0; }
        }

        .content {
            position: relative;
            z-index: 2;
            max-width: 560px;
            animation: content-in 1.1s var(--ease) both;
        }

        @keyframes content-in {
            from { opacity: 0; transform: translateY(28px) scale(0.96); }
            to { opacity: 1; transform: none; }
        }

        .logo-ring {
            width: 88px;
            height: 88px;
            margin: 0 auto 28px;
            border-radius: 24px;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: 0.06em;
            color: #fff;
            background: linear-gradient(145deg, var(--accent), #0284c7 55%, var(--accent-2));
            box-shadow:
                0 0 0 1px rgba(56, 189, 248, 0.4),
                0 0 40px rgba(14, 165, 233, 0.35),
                0 16px 48px rgba(0, 0, 0, 0.45);
            animation: logo-pulse 3s ease-in-out infinite;
        }

        @keyframes logo-pulse {
            0%, 100% { box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.4), 0 0 40px rgba(14, 165, 233, 0.35), 0 16px 48px rgba(0, 0, 0, 0.45); }
            50% { box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.65), 0 0 56px rgba(14, 165, 233, 0.5), 0 16px 48px rgba(0, 0, 0, 0.45); }
        }

        .logo-ring::before {
            content: '';
            position: absolute;
            inset: -12px;
            border-radius: 32px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            animation: ring-spin 12s linear infinite;
        }

        @keyframes ring-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f0f9ff, #7dd3fc 45%, #2dd4bf);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tagline {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.7;
            margin-bottom: 36px;
        }

        .enter-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            border: 1px solid rgba(56, 189, 248, 0.45);
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.18), rgba(8, 47, 73, 0.6));
            color: #e0f2fe;
            font-size: 15px;
            font-weight: 650;
            letter-spacing: 0.06em;
            box-shadow: 0 0 24px rgba(14, 165, 233, 0.2);
            transition: transform 0.25s var(--ease), box-shadow 0.25s, border-color 0.25s;
            animation: btn-glow 2.4s ease-in-out infinite;
        }

        @keyframes btn-glow {
            0%, 100% { box-shadow: 0 0 24px rgba(14, 165, 233, 0.2); }
            50% { box-shadow: 0 0 36px rgba(14, 165, 233, 0.38); }
        }

        .welcome:hover .enter-btn {
            transform: translateY(-2px);
            border-color: rgba(56, 189, 248, 0.75);
            box-shadow: 0 0 40px rgba(14, 165, 233, 0.45);
        }

        .enter-btn svg {
            width: 18px;
            height: 18px;
            transition: transform 0.3s var(--ease);
        }

        .welcome:hover .enter-btn svg {
            transform: translateX(4px);
        }

        .hint {
            margin-top: 20px;
            font-size: 11px;
            color: rgba(122, 154, 184, 0.75);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .meta-row {
            position: absolute;
            bottom: 24px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 11px;
            color: rgba(122, 154, 184, 0.55);
            z-index: 2;
        }

        .meta-row span::before {
            content: '◆ ';
            color: var(--accent);
            font-size: 8px;
            vertical-align: middle;
        }

        /* 離場跳轉動畫 */
        .welcome.leaving {
            pointer-events: none;
        }

        .welcome.leaving .content {
            animation: content-out 0.55s var(--ease) forwards;
        }

        @keyframes content-out {
            to { opacity: 0; transform: scale(1.08) translateY(-20px); filter: blur(6px); }
        }

        .warp-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.5) 0%, transparent 55%);
        }

        .welcome.leaving .warp-overlay {
            animation: warp-burst 0.85s var(--ease) forwards;
        }

        @keyframes warp-burst {
            0% { opacity: 0; transform: scale(0.2); }
            35% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(2.5); background: var(--bg); }
        }

        .streak {
            position: fixed;
            inset: 0;
            z-index: 99;
            pointer-events: none;
            opacity: 0;
            background: linear-gradient(
                105deg,
                transparent 42%,
                rgba(56, 189, 248, 0.15) 48%,
                rgba(125, 211, 252, 0.55) 50%,
                rgba(56, 189, 248, 0.15) 52%,
                transparent 58%
            );
        }

        .welcome.leaving .streak {
            animation: streak-sweep 0.7s var(--ease) forwards;
        }

        @keyframes streak-sweep {
            0% { opacity: 0; transform: translateX(-100%) skewX(-8deg); }
            30% { opacity: 1; }
            100% { opacity: 0; transform: translateX(100%) skewX(-8deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <div class="welcome" id="welcome" role="button" tabindex="0" aria-label="點擊進入監控戰情室">
        <div class="grid-bg" aria-hidden="true"></div>
        <div class="glow-orb a" aria-hidden="true"></div>
        <div class="glow-orb b" aria-hidden="true"></div>
        <div class="scanline" aria-hidden="true"></div>
        <div class="streak" aria-hidden="true"></div>
        <div class="warp-overlay" aria-hidden="true"></div>

        <div class="content">
            <div class="logo-ring" style="position:relative">SS</div>
            <h1>Semi-Shield ISMS</h1>
            <p class="tagline">
                OT 工控資安 · ISO/IEC 27001 合規<br>
                半導體無塵室監控戰情 · 地端 AI Agent
            </p>
            <div class="enter-btn" id="enterBtn">
                進入監控戰情室
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                    <path d="M5 12h14M13 6l6 6-6 6"/>
                </svg>
            </div>
            <p class="hint">點擊任意處開始</p>
        </div>

        <div class="meta-row" aria-hidden="true">
            <span>ISO 27001</span>
            <span>OT Syslog</span>
            <span>Edge AI</span>
        </div>
    </div>

    <script>
        const welcome = document.getElementById('welcome');
        let navigating = false;

        function enterPlatform() {
            if (navigating) return;
            navigating = true;
            welcome.classList.add('leaving');
            try {
                sessionStorage.setItem('ss_welcome_enter', '1');
            } catch (_) {}
            setTimeout(() => {
                window.location.href = '/platform?view=monitor';
            }, 780);
        }

        welcome.addEventListener('click', enterPlatform);
        welcome.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                enterPlatform();
            }
        });

        // 若使用者直接帶 skip 參數則略過歡迎頁
        if (new URLSearchParams(location.search).get('skip') === '1') {
            window.location.replace('/platform?view=monitor');
        }
    </script>
</body>
</html>
