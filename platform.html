<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semi-Shield ISMS 整合平台</title>
    <style>
        :root {
            --shell-bg: #0b1220;
            --panel-bg: #111827;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #1e293b;
            --accent: #38bdf8;
            --accent-2: #6366f1;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            font-family: "Segoe UI", "Noto Sans TC", sans-serif;
            background: var(--shell-bg);
            color: var(--text);
            overflow: hidden;
        }

        .shell {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 58px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 18px;
            background: linear-gradient(90deg, #0f172a, #111827 55%, #1e1b4b);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 220px;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 12px;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 0 16px rgba(99, 102, 241, 0.35);
        }

        .brand h1 {
            margin: 0;
            font-size: 15px;
            letter-spacing: 0.02em;
        }

        .brand p {
            margin: 2px 0 0;
            font-size: 11px;
            color: var(--muted);
        }

        .nav-tabs {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 4px;
        }

        .nav-tabs button {
            border: none;
            background: transparent;
            color: var(--muted);
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-tabs button.active {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(99, 102, 241, 0.35));
            color: #fff;
            box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.25);
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-split {
            border: 1px solid #334155;
            background: #0f172a;
            color: #cbd5e1;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-split.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(56, 189, 248, 0.08);
        }

        .status-chip {
            font-size: 11px;
            color: var(--muted);
            font-family: ui-monospace, Consolas, monospace;
            white-space: nowrap;
        }

        .workspace {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 1fr;
            gap: 0;
            background: #020617;
        }

        .workspace.split {
            grid-template-columns: 1.2fr 1fr;
            gap: 1px;
            background: var(--border);
        }

        .pane {
            min-width: 0;
            min-height: 0;
            background: #020617;
            display: none;
            position: relative;
            overflow: hidden;
        }

        .workspace.single .pane.active,
        .workspace.split .pane {
            display: flex;
            flex-direction: column;
        }

        .frame-host {
            flex: 1;
            min-height: 0;
            min-width: 0;
            position: relative;
            overflow: hidden;
            background: #fff;
        }

        .frame-host iframe {
            border: 0;
            background: #fff;
            display: block;
            transform-origin: top left;
            will-change: transform;
        }

        /* 單頁模式：填滿 */
        .workspace.single .frame-host iframe {
            width: 100% !important;
            height: 100% !important;
            transform: none !important;
        }

        .pane-label {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2;
            font-size: 11px;
            font-weight: 700;
            color: #e2e8f0;
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid rgba(51, 65, 85, 0.9);
            border-radius: 999px;
            padding: 4px 10px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .scale-chip {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2;
            font-size: 10px;
            font-weight: 600;
            font-family: ui-monospace, Consolas, monospace;
            color: #cbd5e1;
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid rgba(51, 65, 85, 0.9);
            border-radius: 999px;
            padding: 3px 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .workspace.split .pane-label,
        .workspace.split .scale-chip {
            opacity: 1;
        }

        @media (max-width: 960px) {
            .brand p { display: none; }
            .btn-split { display: none; }
            .workspace.split { grid-template-columns: 1fr; }
            .topbar { padding: 0 10px; }
            .nav-tabs button { padding: 8px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">SS</div>
                <div>
                    <h1>Semi-Shield ISMS 整合平台</h1>
                    <p>監控戰情室 × AI Agent 一站式合規作業</p>
                </div>
            </div>

            <nav class="nav-tabs" id="navTabs">
                <button type="button" class="active" data-view="monitor">監控戰情</button>
                <button type="button" data-view="chat">AI 對話</button>
            </nav>

            <div class="top-actions">
                <button type="button" class="btn-split" id="splitBtn" title="同時顯示兩個模組並自動縮放">並排檢視</button>
                <span class="status-chip" id="statusChip">系統就緒</span>
            </div>
        </header>

        <main class="workspace single" id="workspace">
            <section class="pane active" id="pane-monitor" data-pane="monitor" data-design-width="1440">
                <div class="pane-label">監控戰情室</div>
                <div class="scale-chip" data-scale-chip>100%</div>
                <div class="frame-host">
                    <iframe src="/monitor?embed=1" title="監控戰情室"></iframe>
                </div>
            </section>
            <section class="pane" id="pane-chat" data-pane="chat" data-design-width="960">
                <div class="pane-label">AI Agent</div>
                <div class="scale-chip" data-scale-chip>100%</div>
                <div class="frame-host">
                    <iframe src="/chat?embed=1" title="AI Agent 對話"></iframe>
                </div>
            </section>
        </main>
    </div>

    <script>
        const workspace = document.getElementById('workspace');
        const splitBtn = document.getElementById('splitBtn');
        const statusChip = document.getElementById('statusChip');
        const tabs = Array.from(document.querySelectorAll('#navTabs button'));
        let currentView = 'monitor';
        let splitMode = false;
        let systemStatusText = '';
        let resizeTimer = null;

        function fitPane(pane) {
            const host = pane.querySelector('.frame-host');
            const iframe = pane.querySelector('iframe');
            const chip = pane.querySelector('[data-scale-chip]');
            if (!host || !iframe) return;

            if (!splitMode) {
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.transform = 'none';
                if (chip) chip.textContent = '100%';
                try {
                    iframe.contentWindow?.postMessage({ type: 'platform-scale', scale: 1, split: false }, '*');
                } catch (_) {}
                return;
            }

            const availW = host.clientWidth || 1;
            const availH = host.clientHeight || 1;
            const designW = Math.max(800, Number(pane.dataset.designWidth) || 1280);
            // 寬度優先縮放，並限制在合理範圍，避免過小難讀
            let scale = availW / designW;
            scale = Math.max(0.45, Math.min(1, scale));

            const virtualH = Math.max(availH / scale, 700);
            iframe.style.width = `${designW}px`;
            iframe.style.height = `${virtualH}px`;
            iframe.style.transform = `scale(${scale})`;

            if (chip) chip.textContent = `${Math.round(scale * 100)}%`;
            try {
                iframe.contentWindow?.postMessage({ type: 'platform-scale', scale, split: true }, '*');
            } catch (_) {}
        }

        function fitAllPanes() {
            document.querySelectorAll('.pane').forEach((pane) => {
                if (!splitMode && !pane.classList.contains('active')) return;
                fitPane(pane);
            });
        }

        function scheduleFit() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(fitAllPanes, 60);
        }

        function updateStatusChip() {
            if (splitMode) {
                statusChip.textContent = systemStatusText
                    ? `並排＋自動縮放 · ${systemStatusText}`
                    : '並排模式：自動縮放至合適大小';
                return;
            }
            if (systemStatusText) {
                statusChip.textContent = systemStatusText;
                return;
            }
            statusChip.textContent = currentView === 'monitor' ? '目前：監控戰情室' : '目前：AI 對話';
        }

        function applyView() {
            if (splitMode) {
                workspace.classList.add('split');
                workspace.classList.remove('single');
                document.querySelectorAll('.pane').forEach((p) => p.classList.add('active'));
                tabs.forEach((t) => t.classList.remove('active'));
                updateStatusChip();
                // 等 grid 完成布局後再量測
                requestAnimationFrame(() => requestAnimationFrame(fitAllPanes));
                return;
            }

            workspace.classList.remove('split');
            workspace.classList.add('single');
            document.querySelectorAll('.pane').forEach((p) => {
                p.classList.toggle('active', p.dataset.pane === currentView);
            });
            tabs.forEach((t) => t.classList.toggle('active', t.dataset.view === currentView));
            updateStatusChip();
            requestAnimationFrame(() => requestAnimationFrame(fitAllPanes));
        }

        tabs.forEach((btn) => {
            btn.addEventListener('click', () => {
                currentView = btn.dataset.view;
                if (splitMode) {
                    splitMode = false;
                    splitBtn.classList.remove('active');
                }
                applyView();
            });
        });

        splitBtn.addEventListener('click', () => {
            splitMode = !splitMode;
            splitBtn.classList.toggle('active', splitMode);
            applyView();
        });

        window.addEventListener('resize', scheduleFit);

        // iframe 載入後再量一次
        document.querySelectorAll('.pane iframe').forEach((iframe) => {
            iframe.addEventListener('load', scheduleFit);
        });

        // 監看 pane 尺寸變化（拖曳視窗、DPI 等）
        if (typeof ResizeObserver !== 'undefined') {
            const ro = new ResizeObserver(scheduleFit);
            document.querySelectorAll('.pane .frame-host').forEach((el) => ro.observe(el));
        }

        (async function loadStatus() {
            try {
                const res = await fetch('/api/safety/status');
                if (!res.ok) return;
                const s = await res.json();
                const rag = s.rag_enabled ? `RAG ON(${s.rag_docs || 0})` : 'RAG OFF';
                const guard = (s.guardrail_enabled === false || s.guardrail_mode === 'disabled')
                    ? '護欄 OFF'
                    : `護欄 ${s.guardrail_mode}`;
                const offline = s.offline_ready === false ? '離線套件缺檔' : '離線就緒';
                systemStatusText = `${rag} · ${guard} · ${offline}`;
                updateStatusChip();
            } catch (_) {}
        })();

        applyView();
    </script>
</body>
</html>
